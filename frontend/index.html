<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>간호사 듀티표 생성기</title>
    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        font-family: 'Malgun Gothic', 'Apple SD Gothic Neo', 'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif;
        -webkit-font-smoothing: antialiased;
        letter-spacing: -0.1px;
      }
      :root {
        --color-background-primary: #ffffff;
        --color-background-secondary: #f2f4f6;
        --color-background-tertiary: #f9fafb;
        --color-text-primary: #191f28;
        --color-text-secondary: #6b7684;
        --color-border-secondary: #e5e8eb;
        --color-border-tertiary: #f2f4f6;
        --color-accent: #3182f6;
        --color-accent-bg: #eaf2ff;
      }
      ::-webkit-scrollbar { width: 10px; height: 10px; }
      ::-webkit-scrollbar-thumb { background: #d1d6db; border-radius: 8px; border: 2px solid transparent; background-clip: content-box; }
      ::-webkit-scrollbar-track { background: transparent; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
